<!doctype html>
<meta charset="utf-8">
<title>mock analytics</title>
<body>
<h1>Account analytics</h1>
<button id="export">Export data</button>
<div id="menu" role="menu" hidden>
  <div role="menuitem" data-file="account_analytics_content_2026-09-17_2026-09-23.csv">Content</div>
  <div role="menuitem" data-file="account_overview_analytics.csv">Overview</div>
</div>
<script>
  if (new URLSearchParams(location.search).get('mode') === 'nopremium') document.body.innerHTML = '<h1>Get Premium to see your analytics</h1>';
  document.getElementById('export')?.addEventListener('click', () => { document.getElementById('menu').hidden = false; });
  document.querySelectorAll('[role="menuitem"]').forEach(item => item.addEventListener('click', () => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob(['Post id,Impressions\n1,5\n'], { type: 'text/csv' }));
    a.download = item.dataset.file; document.body.appendChild(a); a.click();
    document.getElementById('menu').hidden = true;
  }));
</script>
